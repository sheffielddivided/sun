name: Oppdater månedlig

on:
  schedule:
    - cron: '0 5 2 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    uses: ./.github/workflows/_update.yml
    with:
      group: monthly
    permissions:
      contents: write
      pages: write
      id-token: write
