<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t1 d1" font-family="system-ui, sans-serif" font-size="14">
  <title id="t1">Oppbygningen av en solflekk</title>
  <desc id="d1">Til venstre sett ovenfra: en mørk indre kjerne (umbra) omgitt av en lysere kantsone med strålemønster (penumbra). Til høyre et vertikalt snitt gjennom solens overflate: magnetfeltlinjer som en tett bunt går opp gjennom overflaten, der de hemmer varmetransporten fra dypet, slik at området blir kjøligere og dermed mørkere enn omgivelsene.</desc>
  <defs>
    <radialGradient id="penumbra" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#7a3b0a"/>
      <stop offset="1" stop-color="#e8a33a"/>
    </radialGradient>
  </defs>
  <g transform="translate(20 10)">
    <text x="0" y="14" style="fill:currentColor" font-weight="700">Sett ovenfra</text>
    <rect x="0" y="24" width="300" height="270" rx="10" fill="#f0b84a"/>
    <circle cx="150" cy="160" r="95" fill="url(#penumbra)"/>
    <g stroke="#3d1d05" stroke-opacity=".45" stroke-width="1.6">
      <path d="M150 160L240 130M150 160L246 160M150 160L238 192M150 160L205 238M150 160L150 252M150 160L96 240M150 160L62 196M150 160L58 150M150 160L72 100M150 160L120 72M150 160L170 66M150 160L222 90"/>
    </g>
    <ellipse cx="150" cy="160" rx="44" ry="40" fill="#1a0a02"/>
    <g style="fill:#14181d" font-size="13">
      <rect x="196" y="40" width="96" height="22" rx="4" fill="#fff" fill-opacity=".92"/>
      <text x="202" y="56">Umbra (mørkest)</text>
      <rect x="6" y="262" width="150" height="22" rx="4" fill="#fff" fill-opacity=".92"/>
      <text x="12" y="278">Penumbra (kantsone)</text>
      <rect x="196" y="262" width="96" height="22" rx="4" fill="#fff" fill-opacity=".92"/>
      <text x="202" y="278">Fotosfære</text>
    </g>
  </g>
  <g transform="translate(360 10)">
    <text x="0" y="14" style="fill:currentColor" font-weight="700">Snitt gjennom overflaten</text>
    <rect x="0" y="24" width="380" height="120" fill="#f0b84a"/>
    <rect x="0" y="144" width="380" height="150" fill="#b8531a"/>
    <path d="M0 144H140Q190 160 240 144H380" fill="none" stroke="#3d1d05" stroke-width="3"/>
    <rect x="140" y="140" width="100" height="8" fill="#1a0a02"/>
    <g stroke="#14181d" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M170 280V60M190 280V50M210 280V60"/>
      <path d="M170 60l-5 10M190 50l-5 10M210 60l-5 10" />
      <path d="M150 90Q120 60 100 40M230 90Q260 60 280 40" stroke-dasharray="5 4"/>
    </g>
    <g style="fill:currentColor" font-size="13">
      <text x="4" y="124" fill="#14181d">Fotosfære, ca. 5 800 K</text>
      <text x="4" y="168" fill="#fff">Konveksjon bringer varme opp</text>
      <text x="4" y="186" fill="#fff">fra dypet (gløder utenfor flekken)</text>
    </g>
    <g font-size="13">
      <rect x="244" y="196" width="130" height="62" rx="4" fill="#fff" fill-opacity=".94"/>
      <text x="250" y="214" fill="#14181d">Sterkt magnetfelt</text>
      <text x="250" y="231" fill="#14181d">(ca. 0,2–0,3 T) hemmer</text>
      <text x="250" y="248" fill="#14181d">varmetransporten</text>
      <rect x="150" y="30" width="82" height="22" rx="4" fill="#fff" fill-opacity=".94"/>
      <text x="156" y="46" fill="#14181d">Umbra, ca. 4 000 K</text>
    </g>
  </g>
</svg>
