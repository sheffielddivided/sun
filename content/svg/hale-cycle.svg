<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t2 d2" font-family="system-ui, sans-serif" font-size="14">
  <title id="t2">Den 22-årige magnetiske Hale-syklusen</title>
  <desc id="d2">Tre påfølgende solsykluser vist som tre kolonner. Hver kolonne har to rader, nordlige og sørlige halvkule, med polariteten til det ledende flekkparet. Polariteten er motsatt mellom halvkulene og snur fra én syklus til neste. Først etter to sykluser, omtrent 22 år, er magnetfeltet tilbake i samme konfigurasjon.</desc>
  <g style="fill:currentColor">
    <text x="130" y="30" text-anchor="middle" font-weight="700">Syklus n</text>
    <text x="380" y="30" text-anchor="middle" font-weight="700">Syklus n + 1</text>
    <text x="630" y="30" text-anchor="middle" font-weight="700">Syklus n + 2</text>
    <text x="8" y="106">Nordlig halvkule</text>
    <text x="8" y="196">Sørlig halvkule</text>
  </g>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <rect x="70" y="50" width="120" height="70" rx="8"/><rect x="320" y="50" width="120" height="70" rx="8"/><rect x="570" y="50" width="120" height="70" rx="8"/>
    <rect x="70" y="140" width="120" height="70" rx="8"/><rect x="320" y="140" width="120" height="70" rx="8"/><rect x="570" y="140" width="120" height="70" rx="8"/>
  </g>
  <g font-size="26" font-weight="700" text-anchor="middle">
    <!-- Nordlig halvkule: ledende flekk til venstre, etterfølgende til høyre -->
    <text x="100" y="95" style="fill:var(--s2)">+</text><text x="160" y="95" style="fill:var(--s1)">−</text>
    <text x="350" y="95" style="fill:var(--s1)">−</text><text x="410" y="95" style="fill:var(--s2)">+</text>
    <text x="600" y="95" style="fill:var(--s2)">+</text><text x="660" y="95" style="fill:var(--s1)">−</text>
    <!-- Sørlig halvkule: motsatt -->
    <text x="100" y="185" style="fill:var(--s1)">−</text><text x="160" y="185" style="fill:var(--s2)">+</text>
    <text x="350" y="185" style="fill:var(--s2)">+</text><text x="410" y="185" style="fill:var(--s1)">−</text>
    <text x="600" y="185" style="fill:var(--s1)">−</text><text x="660" y="185" style="fill:var(--s2)">+</text>
  </g>
  <g style="fill:currentColor" font-size="12" text-anchor="middle">
    <text x="130" y="112">(ledende flekk til venstre)</text>
    <text x="380" y="112">(polariteten snur)</text>
    <text x="630" y="112">(som i syklus n)</text>
  </g>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <path d="M70 244v10h250v-10M320 244v10h250v-10" />
    <path d="M70 272v10h500v-10" />
  </g>
  <g style="fill:currentColor" text-anchor="middle">
    <text x="195" y="248" font-size="13" dy="20" transform="translate(0 -6)">solflekksyklus ≈ 11 år</text>
    <text x="445" y="248" font-size="13" dy="20" transform="translate(0 -6)">solflekksyklus ≈ 11 år</text>
    <text x="320" y="296" font-size="13" font-weight="700" dy="-2">Hale-syklus (magnetisk syklus) ≈ 22 år</text>
  </g>
</svg>
